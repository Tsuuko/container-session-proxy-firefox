name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Tag must be a Firefox-compatible version like v1.2.3 or 1.2.3." >&2
            exit 1
          fi
          npm pkg set "version=$version"

      - name: Compile
        run: pnpm run compile

      - name: Package Firefox extension
        run: pnpm run zip:firefox

      - name: Prepare release asset
        id: asset
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f .output/*-sources.zip
          asset="$(find .output -maxdepth 1 -type f -name '*-firefox.zip' -print -quit)"
          if [[ -z "$asset" ]]; then
            echo "No Firefox extension zip was generated." >&2
            exit 1
          fi
          safe_tag="${TAG_NAME//\//-}"
          release_asset=".output/container-session-proxy-firefox-${safe_tag}.zip"
          mv "$asset" "$release_asset"
          echo "path=$release_asset" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: ${{ steps.asset.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ASSET_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$ASSET_PATH" \
              --title "$TAG_NAME" \
              --generate-notes \
              --verify-tag
          fi
